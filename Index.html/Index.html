<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Black & White</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    color:#fff;
}

header{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
    z-index:100;
}

.logo{
    font-size:22px;
    letter-spacing:4px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin-left:30px;
    opacity:.8;
    transition:.3s;
}

nav a:hover{
    opacity:1;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
}

.hero h1{
    font-size:70px;
    font-weight:300;
    letter-spacing:6px;
}

.hero p{
    margin-top:20px;
    color:#aaa;
    max-width:600px;
}

.gallery{
    width:90%;
    max-width:1300px;
    margin:auto;
    padding:80px 0;
}

.video-card{
    margin-bottom:80px;
}

video{
    width:100%;
    border:1px solid #222;
    border-radius:10px;
    display:block;
}

.title{
    margin:18px 0;
    font-size:28px;
    font-weight:300;
    letter-spacing:2px;
}

footer{
    text-align:center;
    padding:40px;
    border-top:1px solid #222;
    color:#777;
}
</style>

</head>
<body>

<header>
<div class="logo">BLACK</div>

<nav>
<a href="#">Home</a>
<a href="#">Work</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Minimal Motion</h1>
<p>Black. White. Simple. Elegant.</p>
</section>

<section class="gallery">

<div class="video-card">
<div class="title">Network</div>
<video autoplay muted loop playsinline>
<source src="3D_network_nodes_abstract_lines_202607261939.mp4" type="video/mp4">
</video>
</div>

<div class="video-card">
<div class="title">Artificial Intelligence</div>
<video autoplay muted loop playsinline>
<source src="Abstract_AI_tech_loop_202607261939.mp4" type="video/mp4">
</video>
</div>

<div class="video-card">
<div class="title">Fluid Motion</div>
<video autoplay muted loop playsinline>
<source src="Fluid_silk_waves_obsidian_gold_202607261939.mp4" type="video/mp4">
</video>
</div>

</section>

<footer>
© 2026
</footer>

</body>
</html>
